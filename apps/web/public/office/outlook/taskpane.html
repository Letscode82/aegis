<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AEGIS Intake</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
      :root { --navy:#1B2A4A; --amber:#9A6A00; --grey:#5B6472; --line:#e2e0d8; --bg:#faf9f5; --green:#2f7d4f; }
      * { box-sizing: border-box; }
      body { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: var(--bg); color: #1c1b19; }
      .wrap { padding: 14px; }
      h1 { font-size: 15px; margin: 0 0 2px; color: var(--navy); }
      .sub { color: var(--grey); font-size: 12px; margin: 0 0 12px; }
      .field { margin: 8px 0; font-size: 13px; }
      .field .k { color: var(--grey); font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }
      .field .v { font-weight: 600; word-break: break-word; }
      button { width: 100%; border: 0; border-radius: 6px; padding: 10px; font: inherit; font-weight: 600; cursor: pointer; background: var(--navy); color: #fff; margin-top: 10px; }
      button:disabled { opacity: .5; cursor: default; }
      .status { margin-top: 12px; font-size: 12px; color: var(--grey); min-height: 16px; }
      .status.err { color: #b00020; }
      .status.ok { color: var(--green); font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>AEGIS Intake</h1>
      <p class="sub">File this email as a legal intake request.</p>

      <div class="field"><div class="k">From</div><div class="v" id="from">—</div></div>
      <div class="field"><div class="k">Subject</div><div class="v" id="subject">—</div></div>

      <button id="file" type="button">File to AEGIS Intake</button>
      <div id="status" class="status"></div>
    </div>
    <script src="./taskpane.js"></script>
  </body>
</html>
