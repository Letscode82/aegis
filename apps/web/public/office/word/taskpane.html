<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AEGIS Redline</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
      :root { --navy:#1B2A4A; --amber:#9A6A00; --grey:#5B6472; --line:#e2e0d8; --bg:#faf9f5; }
      * { box-sizing: border-box; }
      body { font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: var(--bg); color: #1c1b19; }
      .wrap { padding: 14px; }
      h1 { font-size: 15px; margin: 0 0 2px; color: var(--navy); }
      .sub { color: var(--grey); font-size: 12px; margin: 0 0 12px; }
      label { display: block; font-weight: 600; font-size: 12px; margin: 10px 0 4px; }
      textarea, input[type="text"] { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: inherit; }
      textarea { min-height: 96px; resize: vertical; }
      .row { display: flex; gap: 8px; margin-top: 12px; }
      button { flex: 1; border: 0; border-radius: 6px; padding: 9px 10px; font: inherit; font-weight: 600; cursor: pointer; }
      .primary { background: var(--navy); color: #fff; }
      .ghost { background: #fff; border: 1px solid var(--line); color: var(--navy); }
      button:disabled { opacity: .5; cursor: default; }
      .status { margin-top: 12px; font-size: 12px; color: var(--grey); min-height: 16px; }
      .status.err { color: #b00020; }
      .note { margin-top: 12px; padding: 8px 10px; border-left: 3px solid var(--amber); background: #fff; font-size: 12px; color: var(--grey); border-radius: 0 6px 6px 0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>AEGIS Redline</h1>
      <p class="sub">Select a clause, describe the change, and apply it as tracked changes.</p>

      <label for="original">Clause (from your selection)</label>
      <textarea id="original" placeholder="Select text in the document, or paste a clause here."></textarea>

      <label for="instruction">What should change?</label>
      <input id="instruction" type="text" placeholder="e.g. Cap our liability at fees paid in the prior 12 months." />

      <div class="row">
        <button id="useSelection" class="ghost" type="button">Use selection</button>
      </div>
      <div class="row">
        <button id="apply" class="primary" type="button">Redline in document</button>
        <button id="download" class="ghost" type="button">Download .docx</button>
      </div>

      <div id="status" class="status"></div>
      <div id="rationale" class="note" hidden></div>
    </div>
    <script src="./taskpane.js"></script>
  </body>
</html>
